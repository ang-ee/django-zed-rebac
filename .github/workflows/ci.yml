name: CI

# The fast gate for every push and pull request. Longer suites run in their
# own workflows after this one succeeds, so a slow suite never holds up the
# lint, type and SQLite results, and publishing waits only on this gate.

# Pushes to lane branches don't run CI; their commits run it on main or in a
# pull request, so one commit is tested once.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Branch protection requires this check name.
    name: test (3.14, 6.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # uv's managed Python bundles a current SQLite. The runner's system
      # SQLite has a fixed parser stack that deep read plans overflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv venv --python 3.14 --python-preference only-managed
          uv run --no-sync python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          uv pip install -e '.[dev,caveats,drf,strawberry]' 'django==6.0.*'
      - name: Lint, format and types
        run: make lint format-check typecheck
      - name: SQLite suite
        run: make test-parallel
      # Budgets measured with nothing else running, after the parallel suite.
      - name: Scale budgets
        run: make test-scale
