name: CI

# Tier 1 and tier 2 (docs/ARCHITECTURE.md § Test tiers) as parallel jobs.
# Tier 1 is the gate for merging and for publishing: Publish to PyPI reads the
# result of the `tier 1` job, not of this whole run. Tier 3 runs in
# release.yml.

# Pushes to lane branches don't run CI; their commits run it on main or in a
# pull request, so one commit is tested once.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Branch protection requires this check name; the matrix is in pyproject.
    name: tier 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # uv's managed Python bundles a current SQLite. The runner's system
      # SQLite has a fixed parser stack that deep read plans overflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.14 --managed-python --extra caveats --extra drf --extra strawberry
          uv run --no-sync python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
      - name: Lint, format, types and the SQLite suite
        run: make check

  # Twice: with Django's default client-side binding, and with server-side
  # binding and every statement prepared, where PostgreSQL must type each
  # parameter from its context (REBAC_TEST_POSTGRES_BINDING, tests/settings_postgres.py).
  postgres-delta:
    name: postgres-delta (${{ matrix.binding }} binding)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        binding: [client, server]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rebac-test
          POSTGRES_DB: rebac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rebac_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REBAC_TEST_POSTGRES_URL: postgresql://postgres:rebac-test@127.0.0.1:5432/rebac_test
      REBAC_TEST_POSTGRES_BINDING: ${{ matrix.binding }}
    steps:
      - uses: actions/checkout@v5
      # uv's managed Python bundles a current SQLite. The runner's system
      # SQLite has a fixed parser stack that deep read plans overflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies and PostgreSQL driver
        run: |
          uv sync --locked --python 3.14 --managed-python --extra caveats --extra drf --extra strawberry --group postgres
          uv run --no-sync python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
      - name: PostgreSQL delta
        run: make test-pg
