name: PostgreSQL

# The default suite on PostgreSQL 16. It takes much longer than the SQLite
# suite, so it runs after CI succeeds on a commit instead of beside it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: postgres-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL 16 suite
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rebac-test
          POSTGRES_DB: rebac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rebac_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REBAC_TEST_POSTGRES_URL: postgresql://postgres:rebac-test@127.0.0.1:5432/rebac_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # uv's managed Python bundles a current SQLite. The runner's system
      # SQLite has a fixed parser stack that deep read plans overflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies and PostgreSQL driver
        run: |
          uv venv --python 3.14 --python-preference only-managed
          uv run --no-sync python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          uv pip install -e '.[dev,caveats,drf,strawberry]' 'django==6.0.*' 'psycopg[binary]>=3.2,<4'
      - name: PostgreSQL suite
        run: make test-postgres
      # Budgets and query plans, measured with nothing else running.
      - name: Scale budgets on PostgreSQL
        run: make test-scale-postgres
