name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify release version
        run: |
          uv sync
          export REBAC_INSTALLED_VERSION="$(uv run python -c 'import rebac; print(rebac.__version__)')"
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          package_version = os.environ["REBAC_INSTALLED_VERSION"]

          versions = {
              "tag": expected,
              "pyproject.toml": project_version,
              "installed rebac.__version__": package_version,
          }
          if len(set(versions.values())) != 1:
              for name, version in versions.items():
                  print(f"{name}: {version}")
              print("Release versions must match.")
              sys.exit(1)
          PY

      - name: Build distributions
        # Release artifacts are built only after the same checks as branch CI.
        run: |
          make install-dev
          make check
          uv build --out-dir dist

      - name: Validate distributions
        run: uvx --from twine twine check --strict dist/*

      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
