name: Publish to PyPI

# Publishes a version tag once CI has passed on it. The tests already ran in
# CI on the same commit, so this workflow only verifies the version, builds
# and uploads. A manual run publishes a given tag.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.23.1"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify release version
        run: |
          uv sync
          export REBAC_INSTALLED_VERSION="$(uv run python -c 'import rebac; print(rebac.__version__)')"
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          package_version = os.environ["REBAC_INSTALLED_VERSION"]

          versions = {
              "tag": expected,
              "pyproject.toml": project_version,
              "installed rebac.__version__": package_version,
          }
          if len(set(versions.values())) != 1:
              for name, version in versions.items():
                  print(f"{name}: {version}")
              print("Release versions must match.")
              sys.exit(1)
          PY

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Validate distributions
        run: uvx --from twine twine check --strict dist/*

      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
