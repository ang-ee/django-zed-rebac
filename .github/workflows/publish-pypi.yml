name: Publish to PyPI

# Publishes a version tag once tier 1 has passed on it in CI. The tests already
# ran in CI on the same commit, so this workflow only verifies the version,
# builds and uploads. A manual run publishes a given tag.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.23.1"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  # A tag publishes on tier 1 alone. The CI run also holds the postgres-delta
  # job, and workflow_run.conclusion covers the whole run, so this job reads
  # the result of the tier 1 job by its name instead.
  tier1:
    name: Tier 1 passed on the tag
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      conclusion: ${{ steps.job.outputs.conclusion }}
    steps:
      - name: Read the result of test (3.14, 6.0)
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "test (3.14, 6.0)") | .conclusion')"
          echo "test (3.14, 6.0): ${conclusion:-not found}"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: tier1
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.tier1.outputs.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify release version
        run: |
          uv sync
          export REBAC_INSTALLED_VERSION="$(uv run python -c 'import rebac; print(rebac.__version__)')"
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          package_version = os.environ["REBAC_INSTALLED_VERSION"]

          versions = {
              "tag": expected,
              "pyproject.toml": project_version,
              "installed rebac.__version__": package_version,
          }
          if len(set(versions.values())) != 1:
              for name, version in versions.items():
                  print(f"{name}: {version}")
              print("Release versions must match.")
              sys.exit(1)
          PY

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Validate distributions
        run: uvx --from twine twine check --strict dist/*

      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
